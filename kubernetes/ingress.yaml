apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospitalm-mono-ingress
  namespace: hospitalm-mono
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
    - host: hospitalm-mono.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospitalm-mono-service
                port:
                  number: 80
