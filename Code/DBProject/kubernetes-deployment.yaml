apiVersion: v1
kind: Namespace
metadata:
  name: hospital-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hospital-management
data:
  CloudSqlConnectionName: "PROJECT_ID:REGION:INSTANCE_NAME"
  UseCloudSqlProxy: "true"
  EnableConnectionPooling: "true"
  MaxPoolSize: "100"
  MinPoolSize: "5"
  ConnectionTimeout: "30"
  UseDistributedCache: "true"
  RedisConnectionString: "REDIS_HOST:6379"
  EnableStructuredLogging: "true"
  LogLevel: "Information"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: hospital-management
type: Opaque
stringData:
  # Replace with actual connection string from GCP Secret Manager
  connection-string: "Server=127.0.0.1,1433;Database=DBProject;User Id=sqluser;Password=REPLACE_WITH_SECRET;Connection Timeout=30;Max Pool Size=100;Min Pool Size=5;Pooling=true;"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-management
  namespace: hospital-management
  labels:
    app: hospital-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-management
  template:
    metadata:
      labels:
        app: hospital-management
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
      - name: app
        image: gcr.io/PROJECT_ID/hospital-management:latest
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: DB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: connection-string
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      # Cloud SQL Proxy sidecar container
      - name: cloud-sql-proxy
        image: gcr.io/cloudsql-docker/gce-proxy:latest
        command:
        - "/cloud_sql_proxy"
        - "-instances=PROJECT_ID:REGION:INSTANCE_NAME=tcp:1433"
        - "-credential_file=/secrets/service_account.json"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: service-account
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: service-account
        secret:
          secretName: cloudsql-instance-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-management
  namespace: hospital-management
  labels:
    app: hospital-management
spec:
  type: LoadBalancer
  # Enable session affinity for ASP.NET session state
  # Remove this if using distributed session state (Redis)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: hospital-management
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hospital-management-hpa
  namespace: hospital-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hospital-management
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-management-ingress
  namespace: hospital-management
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "hospital-management-ip"
    networking.gke.io/managed-certificates: "hospital-management-cert"
    # Enable session affinity at ingress level
    ingress.gcp.kubernetes.io/session-affinity: "CLIENT_IP"
spec:
  rules:
  - host: hospital.example.com
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: hospital-management
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: hospital-management-cert
  namespace: hospital-management
spec:
  domains:
  - hospital.example.com
